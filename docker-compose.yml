# Demo stack: `docker compose up --build`, then open http://localhost:8080
# Mail (magic links, notifications): http://localhost:8025 (Mailpit)
x-backend-env: &backend-env
  ENV: dev
  DEMO_MODE: "true"
  DATABASE_URL: postgresql+asyncpg://bonarda:bonarda@postgres:5432/bonarda
  REDIS_URL: redis://redis:6379/0
  PUBLIC_APP_URL: http://localhost:8080
  JWT_SIGNING_KEY: demo-signing-key-0123456789abcdef0123456789
  COOKIE_SECURE: "false"
  SMTP_URL: smtp://mailpit:1025
  MAIL_FROM: Bonarda Works <no-reply@bonarda.works>
  OIDC_ISSUER_URL: http://localhost:8081/realms/bonarda
  OIDC_CLIENT_ID: bonarda-api
  OIDC_CLIENT_SECRET: demo-oidc-secret
  OIDC_REDIRECT_URL: http://localhost:8080/api/v1/auth/oidc/callback
  SCIM_BEARER_TOKEN: demo-scim-token-0123456789abcdef0123456789
  ESIGN_WEBHOOK_SECRET: demo-esign-secret-0123456789abcdef0123456789

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bonarda
      POSTGRES_PASSWORD: bonarda
      POSTGRES_DB: bonarda
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bonarda -d bonarda -h 127.0.0.1"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  api:
    build: ./backend
    restart: on-failure
    environment: *backend-env
    command: >
      sh -c "alembic upgrade head && python -m app.demo_seed &&
             uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    environment: *backend-env
    command: ["arq", "app.worker.settings.WorkerSettings"]
    restart: on-failure
    depends_on:
      - api

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
